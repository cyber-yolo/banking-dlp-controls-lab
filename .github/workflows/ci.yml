name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: YAML lint
        run: |
          pip install yamllint
          yamllint -c .yamllint.yml .
      - name: JSON syntax
        run: |
          find . -name "*.json" -not -path "./synthetic-data-generator/output/*" -print0 \
            | xargs -0 -r -n1 python -c 'import json, sys; json.load(open(sys.argv[1], encoding="utf-8-sig"))'
      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: "**/*.md"

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: synthetic-data-generator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Unit tests
        run: python -m pytest -q
      - name: Generate and validate synthetic corpus (not committed)
        run: |
          python -m dlpgen generate --config config.example.yaml
          python -m dlpgen validate-output --manifest output/manifest.json
      - name: Repository data validator
        run: python -m dlpgen validate-repo --root ..

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | sudo tar -xz -C /usr/local/bin gitleaks
      - name: Scan full history
        run: gitleaks detect --source . --config .gitleaks.toml --redact --no-banner -v
