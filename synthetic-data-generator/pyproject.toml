[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dlpgen"
version = "0.5.0"
description = "Reproducible synthetic banking files for DLP testing (synthetic data only)"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["PyYAML>=6.0", "python-docx>=1.1", "openpyxl>=3.1", "reportlab>=4.0", "Pillow>=10.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
dlpgen = "dlpgen.cli:main"

[tool.setuptools]
packages = ["dlpgen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
